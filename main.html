<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Speed Scrubber</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="player">
    <video class="player__video viewer" width="765" height="430" src="https://www.w3schools.com/html/mov_bbb.mp4"></video>

    <div class="player__controls">
      <div class="progress">
        <div class="progress__filled"></div>
      </div>

      <button class="player__button toggle" title="Toggle Play">►</button>

      <input type="range" name="volume" class="player__slider" min="0" max="1" step="0.05" value="1">
      <input type="range" name="playbackSpeed" class="player__slider" min="0.5" max="2" step="0.1" value="1">

      <button data-skip="-10" class="player__button">« 10s</button>
      <button data-skip="25" class="player__button">25s »</button>
    </div>
  </div>

<script>
  const video = document.querySelector(".viewer");
  const progress = document.querySelector(".progress");
  const progressBar = document.querySelector(".progress__filled");
  const toggle = document.querySelector(".toggle");
  const skipButtons = document.querySelectorAll("[data-skip]");
  const ranges = document.querySelectorAll(".player__slider");

  function togglePlay() {
    if (video.paused) video.play();
    else video.pause();
  }

  function updateButton() {
    toggle.textContent = video.paused ? "►" : "❚ ❚";
  }

  function skip() {
    video.currentTime += parseFloat(this.dataset.skip);
  }

  function handleRangeUpdate() {
    if (this.name === "volume") {
      video.volume = parseFloat(this.value);
    } else if (this.name === "playbackSpeed") {
      video.playbackRate = parseFloat(this.value);
    }
  }

  function handleProgress() {
    const percent = video.duration ? (video.currentTime / video.duration) * 100 : 0;
    progressBar.style.width = percent + "%";
  }

  function scrub(e) {
    video.currentTime = (e.offsetX / progress.offsetWidth) * video.duration;
  }

  video.addEventListener("click", togglePlay);
  video.addEventListener("play", updateButton);
  video.addEventListener("pause", updateButton);
  video.addEventListener("timeupdate", handleProgress);

  toggle.addEventListener("click", togglePlay);
  skipButtons.forEach(btn => btn.addEventListener("click", skip));
  ranges.forEach(range => range.addEventListener("change", handleRangeUpdate));
  ranges.forEach(range => range.addEventListener("input", handleRangeUpdate));

  let mousedown = false;
  progress.addEventListener("click", scrub);
  progress.addEventListener("mousemove", e => mousedown && scrub(e));
  progress.addEventListener("mousedown", () => (mousedown = true));
  progress.addEventListener("mouseup", () => (mousedown = false));

  handleProgress(); // shuru mein bar 0% par rahega
</script>
</body>
</html>
